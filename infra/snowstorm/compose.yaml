name: magister-snomed
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.name: magister-snomed
      ES_JAVA_OPTS: "-Xms4g -Xmx4g"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  snowstorm:
    image: snomedinternational/snowstorm:11.0.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms2g -Xmx4g --add-opens=java.base/java.util=ALL-UNNAMED"
    command:
      - "--elasticsearch.urls=http://elasticsearch:9200"
      - "--snowstorm.rest-api.readonly=true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./rf2:/rf2:ro
volumes:
  elastic-data:
