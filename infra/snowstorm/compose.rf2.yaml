services:
  elasticsearch:
    environment:
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    mem_limit: 3456m
  snowstorm:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms1g -Xmx2304m --add-opens=java.base/java.util=ALL-UNNAMED"
    command:
      - "--elasticsearch.urls=http://elasticsearch:9200"
      - "--snowstorm.rest-api.readonly=${MAGISTER_SNOWSTORM_READONLY:-true}"
      - "--spring.servlet.multipart.max-file-size=1GB"
      - "--spring.servlet.multipart.max-request-size=1GB"
    mem_limit: 3456m
